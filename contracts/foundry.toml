[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Pinned: every test result and the deployed bytecode assume this exact
# compiler. The pragmas are ^0.8.26, so an unpinned forge silently takes the
# newest release instead, which the suite has never run under.
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 5000
via_ir = true
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./test/fixtures" },
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 2048

[profile.fork]
test = "test/fork"

[fmt]
line_length = 120
sort_imports = true

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
